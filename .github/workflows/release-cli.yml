name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows 10/11 (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - label: Linux Static (x86_64 musl)
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p comet-cli --target ${{ matrix.target }}

      - name: Package Windows artifacts
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/comet.exe"
          Copy-Item $bin "dist/comet-windows-x86_64.exe"
          Compress-Archive -Path $bin -DestinationPath "dist/comet-${{ matrix.target }}.zip" -Force
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in ".exe", ".zip" }
          $sums = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $sums | Out-File -FilePath "dist/SHA256SUMS-${{ matrix.target }}.txt" -Encoding ascii

      - name: Package Linux static artifact
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/comet-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" comet
          (cd dist && sha256sum "comet-${{ matrix.target }}.tar.gz" > "SHA256SUMS-${{ matrix.target }}.txt")

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: comet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Merge checksums
        shell: bash
        run: |
          cat artifacts/SHA256SUMS-*.txt > artifacts/SHA256SUMS.txt
          rm -f artifacts/SHA256SUMS-*.txt
          ls -lh artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
